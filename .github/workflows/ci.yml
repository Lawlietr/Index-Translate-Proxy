# CI —— 目前跑到 TODO 的 T3.3：`lint:zh` ＋ `lint:readme` ＋ `smoke` ＋ `npm test`，全部離線。
#
# 為什麼放在 `.github/workflows/`（AGENTS 規則 12）：`origin` 是自建 Forgejo，`github` remote 是它的鏡像，
# CI 用 GitHub 托管 runner——自建 runner 不是「常開就在那裡」的資源。所以推鏡像是 CI 的前置動作。
#
# 順序是刻意的：兩份 README 的對等（規則 11）與繁簡字是這個 repo 最容易破、也最少被機器守住的東西
# （歷史統計：92 次文件改動 vs 21 次代碼改動），所以放最前面、秒級失敗；`smoke` 用的是假 upstream
# （`scripts/smoke-local.mjs`，不聯網、不打上游、不碰 secrets），最後才是 `node --test`。
#
# 下一個停點是 T3.4：`probe-live` 打已部署的生產入口——那是唯一需要 secrets 的一步，也是唯一能對抗
# 上游漂移的機制（事實表那些 ok/fail 都是某天的快照，而上游有撤回模型名稱的先例 `index-homura-*`）。
# 規則 12 的邊界：CI 只准跑 `probe-live`（打已部署的入口），不准跑 `probe-upstream`（直接打上游）——
# CI 的出口不是生產出口，那樣的結果不能進 `design/` 的事實表。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一個 ref 上只留最新一次；探測與測試都不需要保留舊的並發跑。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json 的 engines 是 >=20；本地跑的是 22 → 用 22，別讓 CI 成為「只有 CI 用的版本」。
          node-version: "22"
          cache: npm

      # 測試只用 Node 內建（`node --test` + Web Streams/fetch）：`wrangler` 與 `vercel` 是部署工具，不是測試依賴。
      # 之後若真有測試需要 devDependencies，把 --omit=dev 拿掉即可。
      - name: Install (production deps only)
        run: npm ci --omit=dev

      # 規則 17：這個 repo 是公開可讀的鏡像，通行碼不該進來。放在對等檢查之前不是優先級問題，
      # 是成本問題：key 一旦進去就要改歷史，不是改一個檔就能了結。
      - name: Lint — 沒有通行碼進 repo（規則 17）
        run: npm run lint:secret

      # 規則 11：繁簡字檢查只掃 AGENTS.md／TODO.md／README.md 三份（其他檔案繁簡混雜不是工作）。
      - name: Lint — 用字（規則 11）
        run: npm run lint:zh

      # 規則 11：兩份 README 必須 100% 對等。這個不變量之前只靠人腦記得同步。
      - name: Lint — 兩份 README 結構對等（規則 11）
        run: npm run lint:readme

      # 協定層的回歸（規則 1／3／4／5／6／7／8／9）一次跑完：假 upstream，不聯網、不燒配額。
      - name: Smoke（離線假 upstream）
        run: npm run smoke

      - name: Test
        run: npm test
